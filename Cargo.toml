[package]
name = "processkit-cli"
version = "0.3.1"
edition = "2024"
description = "Standalone CLI runner for ProcessKit process-tree containment and lifecycle diagnostics"
license = "MIT"
repository = "https://github.com/ZelAnton/ProcessKit-CLI"
readme = "README.md"
# Minimum Supported Rust Version. Edition 2024 needs >=1.85, but the `processkit`
# dependency raises the real floor to 1.88, so that is the declared MSRV. Rechecked
# against the `processkit` 3 major bump: 3.0.x still declares `rust-version = "1.88"`
# itself, so the real floor did not move and this value stands unchanged. Raise it
# when you adopt a newer language/std feature or bump a dependency's floor. The
# `msrv` CI job verifies it — keep the two in sync.
rust-version = "1.88"

# cargo-binstall downloads the same root-layout archives produced by
# `.github/workflows/release.yml`, avoiding a local Rust compilation.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# The release workflow uses ZIP only for its two supported Windows targets.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

# ---------------------------------------------------------------------------
# Library target
#
# The crate is a thin binary (`src/main.rs`) over an internal library
# (`src/lib.rs`): every `src/*.rs` module lives in the library, and the binary
# only parses argv and dispatches into it. The library exists so the crate's own
# unit/property tests (`cargo test`, i.e. `--lib`) — and future fuzz (`cargo-fuzz`)
# and benchmark (criterion) tiers, which each need a `[lib]` target — can reach the
# runner's internals directly, not only through the shipped binary.
#
# The target name follows Cargo's implicit convention (the package name with `-`
# normalized to `_`), so the binary imports it as `use processkit_cli::...`; it does
# not collide with the `processkit-cli` binary target, which Cargo lets a library
# and a binary share. This library is NOT a stable public API — every module is
# `#[doc(hidden)]` and exempt from semver; the supported surface stays the binary's
# CLI flags, exit codes, and JSONL `schema_version` (see `src/lib.rs`).
# ---------------------------------------------------------------------------
[lib]
name = "processkit_cli"
path = "src/lib.rs"

# ---------------------------------------------------------------------------
# Dependencies
#
# Convention (see CONTRIBUTING.md "Conventions"): this project fixes NO
# allow-list of crates. Add whatever your project needs — but give every new
# dependency an inline comment explaining *why* it's here and what it's used
# for, so the next reader (human or agent) doesn't have to guess. Pin major
# versions, prefer well-maintained crates, and keep Cargo.lock committed.
#
# Example:
#   serde = { version = "1", features = ["derive"] }  # (de)serialize config
# ---------------------------------------------------------------------------
[dependencies]
# Command-line parsing. The `derive` API expresses the normative CLI surface —
# the ten subcommands (run/inspect/cancel/kill/attest/wait/events/list/prune/probe),
# their flags, the one global option every subcommand shares (`--error-format`),
# and the verbatim `-- <program> <args...>` tail — that AGENTS.md
# counts as part of the compatibility surface.
clap = { version = "4", features = ["derive"] }
# (De)serialize the versioned JSONL event schema — this project's public,
# golden-tested event contract. `derive` gives each event struct its `Serialize`
# impl; `serde_json` writes one compact JSON object per line to the `--jsonl`
# file (and parses lines back in the through-the-binary tests).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ProcessKit's public API: the kernel-backed containment and teardown boundary
# this runner is built on (the single source of truth for lifecycle semantics).
# `run` owns a `ProcessGroup` and streams the child through it; the control-plane
# paths that also call it land in later tasks (docs/ROADMAP.md).
#
# `features = ["limits"]` opts into the whole-tree resource caps
# (`ProcessGroupOptions`/`ResourceLimits`, `ProcessGroup::with_options`, and
# `ErrorReason::ResourceLimit`) that back `run`'s `--max-memory`/`--max-processes`/
# `--cpu-quota` flags — the enforcement primitive is a Windows Job Object or a
# Linux cgroup v2, and the crate hides it behind this opt-in feature (it also
# implies the crate's `stats` feature). Without a limit flag `run` still creates
# the group through the plain `ProcessGroup::new()`, so a default run pulls none
# of this at runtime.
#
# The requirement names 3.2, not a bare `3`: `src/run/teardown.rs` calls
# `ProcessGroup::limit_evidence()` and matches on `LimitVerdict`, neither of which
# exists before 3.2.0, so `^3` would let a resolver legitimately pick 3.1.x and
# fail at compile time instead of at resolution. It also keeps the repository's
# *second* committed lockfile (`fuzz/Cargo.lock`, for the deliberately
# out-of-workspace fuzz crate — see `fuzz/Cargo.toml`) from silently holding an
# older pin that satisfies the manifest but not the code.
processkit = { version = "3.2", features = ["limits"] }
# Async runtime that drives the tokio-based `processkit` API. A small
# current-thread runtime hosts the run; `io-std` provides the async stdout/stderr
# sinks the child's output is teed to. `time` arms the `--timeout` deadline timer
# and the `--grace` window, `signal` the `Ctrl-C` listener (plus, on Unix, SIGTERM/
# SIGHUP, and on Windows Ctrl-Break/console-close/logoff/shutdown), and `macros` the
# `select!` that races them against the child's own exit. `net` provides the local
# control-plane transport (unix domain socket / Windows named pipe, see
# `src/control/mod.rs`) and `io-util` its line-oriented request/response codec. `sync`
# provides the `mpsc` channel the control server signals a `cancel`/`kill` verb
# through to the run's `select!` loop (the loop owns teardown; the server never tears
# a run down itself). The child-pipe I/O driver is compiled in via `processkit`'s own
# tokio `process`/`net` features (Cargo unifies feature flags across the one tokio
# build).
tokio = { version = "1", features = [
    "rt",
    "io-std",
    "io-util",
    "net",
    "time",
    "signal",
    "sync",
    "macros",
] }

[features]
# Opt-in end-to-end containment tier (`tests/e2e.rs`) plus its `e2e_helper`
# worker. Off by default so `cargo test` stays fast; these spawn real, multi-level
# process trees and run longer. The dedicated CI `e2e` job enables it. Empty
# feature set — it only gates which targets build (see the `[[test]]` / `[[bin]]`
# `required-features` below).
e2e = []

# Opt-in concurrency stress tier (`tests/stress.rs`). Off by default so `cargo test`
# stays fast and quiet: the tier launches dozens of simultaneous `run` invocations
# plus parallel `list`/`prune`/`wait`/`inspect`/`cancel`/`kill` clients against one
# shared registry and control plane, so it is both slower and noisier (many real
# processes at once) than the default tier. The dedicated, non-gating
# `stress.yml` CI workflow enables it (`cargo test --features stress --test
# stress`). Empty feature set, same pattern as `e2e`/`bench` — it only gates which
# targets build (see the `[[test]]` `required-features` below). It needs no worker
# binary of its own: every stress workload is the shipped `processkit-cli` binary
# itself, driven through `CARGO_BIN_EXE_processkit-cli`.
stress = []

# Opt-in criterion benchmark tier (`benches/`) plus its `bench_emit` worker. Off
# by default so a plain `cargo build`/`cargo test`/`cargo publish` never builds
# it — benchmarks are dev-only tooling, never shipped. The dedicated,
# non-gating CI `perf` job enables it (`cargo bench --features bench`). Empty
# feature set, same pattern as `e2e` above — it only gates which targets build
# (see the `[[bench]]` / `[[bin]]` `required-features` below).
bench = []

# Unix-only: the run registry (src/registry/mod.rs) restricts its directory to `0700`
# via std, but the per-run liveness lock — a BSD `flock` whose OS-released-on-death
# semantics make an orphaned entry detectably stale — has no std wrapper, so it
# calls `flock`/`LOCK_EX`/`EWOULDBLOCK` through libc directly.
#
# `getpgid` backs the control plane's membership predicate on this platform
# (src/control/mod.rs, `process_group_of`): where the obtained mechanism is the POSIX
# process-group fallback, the container enumerates only tracked group leaders, so
# "shares the process group of a leader" — the very predicate `killpg` enforces at
# teardown — is what lets `attest` answer about a contained grandchild instead of
# reporting it a non-member. A second, independent reason this dependency exists:
# retiring the `flock` above would not retire libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: the run registry (src/registry/mod.rs) needs two Win32 facilities with
# no std equivalent — a *protected* owner-only DACL (the equivalent of unix `0700`;
# built and applied via the Authorization/Security APIs) and the `LockFileEx`
# liveness lock. Only the security, file-locking, token, and memory surfaces are
# enabled. windows-sys is already in the tree transitively (tokio/processkit).
#
# `Win32_System_Threading` additionally backs `run --detach` (src/run/detach.rs): the
# `DETACHED_PROCESS` creation flag the re-spawned runner is created with.
#
# `Win32_System_JobObjects` is enabled solely for the e2e tier's test-support worker
# (`src/bin/e2e_helper.rs`, `job-parent` mode): it self-places into an outer Job
# Object so the nested-Job-Object scenario can prove `run` still contains its tree.
# The bin shares this crate's `[dependencies]` (a `[[bin]]` cannot see dev-deps), so
# that feature lives here rather than in dev-dependencies; the library itself never
# references it.
# `Win32_System_Console` has two callers: that same helper's real-console smoke for
# `--inherit-stdio` (it allocates fresh console handles, then proves the contained
# child still identifies all three inherited streams as a terminal), and — in the
# library proper — `run --detach`, which reads `GetStdHandle` to stop this process's
# standard handles from being inherited by the detached runner (src/run/detach.rs,
# `disinherit_std_handles`).
#
# `Win32_System_Pipes` backs the control plane's peer identity on this platform
# (src/control/platform/windows.rs): `GetNamedPipeClientProcessId` asks the kernel
# which process opened a connected pipe instance, which is what lets `attest` answer
# about the caller itself rather than about a pid the caller named.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# ---------------------------------------------------------------------------
# Build-time dependencies (`build.rs`)
#
# `build.rs` generates shell completions and man pages from the live CLI
# definition (see that file's module doc for why this runs at build time
# rather than as a CLI subcommand). It loads `src/cli/mod.rs` as a module
# (`#[path = "src/cli/mod.rs"] mod cli;`), so it needs the same `clap` derive
# machinery those files use.
# ---------------------------------------------------------------------------
[build-dependencies]
clap = { version = "4", features = ["derive"] }
# Generates the bash/elvish/fish/PowerShell/zsh completion scripts from the
# `clap::Command` tree `build.rs` builds via `Cli::command()`.
clap_complete = "4"
# Generates the roff (`man`) pages for the top-level command and every
# subcommand from that same `clap::Command` tree.
clap_mangen = "0.3"

[dev-dependencies]
# Validates the JSONL event golden fixture (and events emitted by the
# through-the-binary tests) against the published JSON Schema
# (`fixtures/schema/v1/schema.json`), keeping the schema, the code, and
# `docs/schema.md` in lockstep (`tests/events.rs`). Default features pull in a
# remote-`$ref` HTTP/file resolver (and `reqwest`) that this schema — fully
# self-contained via internal `$defs` — never needs, so they are disabled.
#
# It is deliberately a **dev**-dependency even though `events --validate`
# (src/events_cmd/) ships a schema checker of its own: linking this crate into
# the shipped binary would add ~85 crates to its runtime dependency tree (ICU,
# `wasm-bindgen`, `num-bigint`, `fancy-regex`, …) and two license families the
# runtime allow-list in `deny.toml` does not carry, which is not a proportionate
# price for one diagnostic flag in a containment tool. The shipped checker
# instead interprets the embedded schema document directly over the small
# keyword subset that document uses, refusing to run on anything it does not
# implement — and `tests/events.rs` holds it to *this* crate's verdict, line for
# line, over the golden fixture and a generated mutation corpus, so "the checker
# in the binary agrees with a real JSON Schema engine" is a tested fact rather
# than a claim.
jsonschema = { version = "0.49.1", default-features = false }
# Property-based test tier for the hand-rolled primitives (SHA-256 in
# `src/hash.rs`, the `--timeout`/`--grace` duration grammar in `src/cli/parse.rs`,
# and the `HINT_RULES` classifier in `src/events.rs`) — a regression net over
# arbitrary/generated inputs, not just the fixed example vectors already in
# each module's `#[cfg(test)]` block.
proptest = "1"
# Independent reference SHA-256 implementation, used only to cross-check the
# hand-rolled incremental hasher in `src/hash.rs`'s property tests against a
# well-tested, unrelated implementation (rather than against itself).
sha2 = "0.11"

# Statistics-driven microbenchmark harness for the `bench`-gated tier
# (`benches/`, T-187): incremental SHA-256 (`src/hash.rs`), bounded-capture
# absorb (`src/capture.rs`), and the argv hint classifier (`src/events.rs`), plus
# the two through-the-binary scenarios (echo overhead, startup latency). Default
# features disabled to skip the `plotters`/`rayon` chart-rendering machinery this
# project never renders (CI publishes plain text to the step summary, not HTML
# plots); `cargo_bench_support` is the one default feature actually needed — it
# is what makes a plain `cargo bench` (rather than only `cargo criterion`) work.
# In the top-level `[dev-dependencies]` (not the `cfg(unix)` table below) since
# every bench target — including the cross-platform through-the-binary ones —
# needs it, on every platform.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# Unix-only: the cancel integration test needs to deliver a real SIGINT (the
# `Ctrl-C` the runner listens for) to the spawned runner process, which the std
# library cannot do. Also backs the e2e tier's external PID-liveness probe
# (`kill(pid, 0)`, no signal delivered). Behind a `cfg(unix)` target table so
# Windows builds — where an isolated Ctrl-C cannot be sent to a single child, and
# the PID probe uses `tasklist` — never pull it.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The end-to-end tier and its helper worker are gated behind the `e2e` feature so
# a default `cargo test`, a plain `cargo build`, and `cargo publish` never build
# or ship them. Cargo skips a target whose `required-features` are unmet, and sets
# `CARGO_BIN_EXE_e2e_helper` for the tier only when the helper is built alongside
# it (i.e. under `--features e2e`).
[[bin]]
name = "e2e_helper"
path = "src/bin/e2e_helper.rs"
required-features = ["e2e"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e"]

# The concurrency stress tier, gated behind the `stress` feature for the same
# reason the `e2e` tier is gated behind its own: a default `cargo test`, a plain
# `cargo build`, and `cargo publish` never build or ship it. Unlike `e2e` it needs
# no companion `[[bin]]` worker — its workload is the `processkit-cli` binary
# itself (`CARGO_BIN_EXE_processkit-cli`, which Cargo sets for every test target),
# so this one target is the whole tier.
[[test]]
name = "stress"
path = "tests/stress.rs"
required-features = ["stress"]

# Test-support worker for the `bench`-gated through-the-binary scenarios
# (benches/echo_overhead_bench.rs, benches/startup_latency_bench.rs): writes an
# exact, caller-chosen byte count to stdout, so those benchmarks measure the
# runner's own echo/capture overhead against a precisely-sized, otherwise
# minimal child rather than an OS shell builtin (whose own startup cost would
# be conflated with the runner's).
[[bin]]
name = "bench_emit"
path = "src/bin/bench_emit.rs"
required-features = ["bench"]

# `harness = false` on every bench below: criterion supplies its own `main` via
# `criterion_main!`, which would collide with the default libtest bench harness.
[[bench]]
name = "hash_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "capture_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "hint_classifier_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "echo_overhead_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "startup_latency_bench"
harness = false
required-features = ["bench"]

# Phase attribution *inside* the startup window `startup_latency_bench` measures
# end to end: isolates the mutating "owner-only registry open" (`Registry::open_in`)
# against a bare `create_dir_all` and a no-op read-only open, swept over registry
# sizes, so the permission-hardening share — and whether it grows with the number
# of records a Windows inheritable DACL would propagate over — is measured rather
# than assumed.
[[bench]]
name = "registry_open_bench"
harness = false
required-features = ["bench"]
