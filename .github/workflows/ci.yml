name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a new push doesn't queue behind stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      # Config is .yamllint.yml — tuned for Actions YAML. Real defects (tabs,
      # duplicate keys, bad indentation) fail; cosmetic line-length stays a
      # non-failing warning.
      - name: Lint YAML
        run: yamllint .

  installer-lint:
    name: installers and package manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Check POSIX installer
        run: shellcheck install.sh scripts/tests/test-install.sh
      - name: Smoke-test POSIX installer
        run: scripts/tests/test-install.sh
      - name: Test package-manifest generator
        run: python -m unittest scripts/tests/test_generate_package_manifests.py
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  # install.ps1's Windows twin of the installer-lint job above:
  # scripts/tests/install.Tests.ps1 exercises it end to end (checksum
  # verification, destination-identity refusal, -Version pinning, custom
  # -InstallDir) against a local HttpListener fixture server, mirroring what
  # scripts/tests/test-install.sh already does for install.sh in
  # installer-lint. Runs on windows-latest since that's the only runner OS
  # that can execute a .exe fixture the way install.ps1 expects.
  installer-lint-windows:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # windows-latest images ship a Pester build already, but which version
      # varies by image roll; pin explicitly rather than trust whatever is
      # preinstalled, matching this workflow's general policy of pinned
      # versions over floating ones. -SkipPublisherCheck sidesteps the
      # signature-mismatch prompt against the older Pester 3.x module the
      # image also ships (Update-Module territory, not a real trust issue —
      # both are Microsoft-signed).
      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run Windows installer Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/tests/install.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  examples-smoke:
    name: runnable examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --bin processkit-cli
      - name: Run POSIX examples
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          PROCESSKIT_CLI_BIN: ${{ github.workspace }}/target/debug/processkit-cli
        run: |
          examples/preflight.sh
          examples/run-and-read-events.sh
          examples/detach-inspect-wait.sh
          examples/fleet-cancel.sh
      - name: Run PowerShell examples
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          PROCESSKIT_CLI_BIN: ${{ github.workspace }}\target\debug\processkit-cli.exe
        run: |
          ./examples/preflight.ps1
          ./examples/run-and-read-events.ps1
          ./examples/detach-inspect-wait.ps1
          ./examples/fleet-cancel.ps1

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `--all-features` so every feature-gated tier is linted here too, including
      # its cfg(unix) paths on this Linux runner: the `e2e` tier and its helper
      # worker (tests/e2e.rs, src/bin/e2e_helper.rs), the `bench` tier (benches/,
      # src/bin/bench_emit.rs), and the `stress` tier (tests/stress.rs). Those tiers
      # each run in their own job or workflow, so this is the one place their code
      # is lint-gated on every PR.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # ubuntu-24.04-arm and windows-11-arm are GitHub-hosted arm64 runners
      # (free for public repos, same as the x86_64 runners above): they make
      # this job actually execute the test suite on the same
      # aarch64-unknown-linux-gnu / aarch64-pc-windows-msvc triplets the
      # release matrix ships (see release.yml), rather than only
      # relying on the targeted musl test lane below. macos-latest is
      # already aarch64 (Apple Silicon), so with these two additions every
      # aarch64 release target has real, executed test coverage. These two
      # entries are required checks from the start, same as the three
      # existing entries in this matrix (no continue-on-error here, unlike
      # the informational `coverage`/`perf` jobs) — see CONTRIBUTING.md,
      # "Build and test".
      matrix:
        os:
          [
            ubuntu-latest,
            windows-latest,
            macos-latest,
            ubuntu-24.04-arm,
            windows-11-arm,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --all-targets
      - run: cargo test

  coverage:
    name: coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Data source, not a gate: no --fail-under-* threshold is set below, and
    # continue-on-error absorbs any step failure (install hiccup, instrumented
    # build/test failure) so this job never turns red and never blocks a merge —
    # it is not a required check, and the `test`/`clippy`/`fmt`/other jobs above
    # are unaffected either way.
    #
    # Scope mirrors the `test` job above: the default `cargo test` set (the
    # `src/*.rs` unit tests, which now live in the crate's library target and
    # are picked up by a plain `cargo test`, plus the through-the-binary
    # integration tests under `tests/`; see docs/architecture.md, "Test
    # tiers"). ubuntu-latest + windows-latest covers both the `cfg(unix)` and
    # `cfg(windows)` platform halves. The feature-gated `e2e` and `stress` tiers
    # are out of scope here too, same reasoning as `test`: they spawn real,
    # multi-level process trees (and, for `stress`, dozens of simultaneous runs)
    # and are heavier — a separate concern from this job's data.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-llvm-cov
      # Instrument and run the tests once; the two `report` steps below reuse
      # this same profile data instead of re-running the suite (the documented
      # `--no-report` + `report` split, see the cargo-llvm-cov README's "Merge
      # coverages generated under different test conditions").
      - name: Run instrumented tests
        run: cargo llvm-cov --no-report
      - name: Coverage summary
        shell: bash
        run: |
          {
            echo "### Coverage summary (${{ matrix.os }})"
            echo '```text'
            cargo llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage HTML report
        run: cargo llvm-cov report --html --output-dir coverage-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage-report

  perf:
    name: perf (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Regression-timeline data source, not a gate: continue-on-error absorbs
    # any step failure and no threshold is enforced below, so this job never
    # turns red and never blocks a merge — it is not a required check, and
    # the `test`/`clippy`/`fmt`/other jobs above are unaffected either way
    # (same non-gating pattern as the `coverage` job above; see K-029).
    #
    # Shared CI hardware is noisy, so the absolute numbers this job publishes
    # are indicative, not authoritative — track the trend across runs, not a
    # single-run delta. ubuntu-latest + windows-latest mirrors `coverage`'s
    # matrix, covering both the `cfg(unix)` and `cfg(windows)` halves of the
    # through-the-binary scenarios (echo overhead, startup latency).
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The `bench`-gated tier (benches/, src/bin/bench_emit.rs): criterion
      # microbenchmarks of the hash/capture/hint-classifier internals, plus
      # the through-the-binary echo-overhead and startup-latency scenarios
      # (see README.md, "Benchmarks"). Off by default (like `e2e`), so this is
      # the one place in CI that opts in.
      - name: Run benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo bench --features bench 2>&1 | tee benchmark-output.txt
          {
            echo "### Benchmark results (${{ matrix.os }})"
            echo '```text'
            cat benchmark-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write machine-readable benchmark summary
        shell: bash
        run: >-
          python scripts/criterion_history.py summarize target/criterion
          criterion-summary.json --commit "$GITHUB_SHA" --runner "${{ matrix.os }}"
      - name: Find the latest successful main baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow ci.yml --branch main --status success --limit 20 \
            --json databaseId,headSha \
            --jq 'map(select(.headSha != "${{ github.sha }}"))[0].databaseId // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$RUN_ID" ]; then
            echo "No prior successful main run is available; this run seeds the baseline history."
          fi
      - name: Download the prior baseline
        if: ${{ steps.baseline.outputs.run_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: >-
          gh run download "$RUN_ID" --name "perf-history-${{ matrix.os }}"
          --dir perf-baseline
      - name: Compare against the prior main baseline
        if: ${{ hashFiles('perf-baseline/criterion-summary.json') != '' }}
        shell: bash
        run: |
          python scripts/criterion_history.py compare \
            perf-baseline/criterion-summary.json criterion-summary.json \
            --threshold-percent 20 --markdown perf-comparison.md
          cat perf-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark history point
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-history-${{ matrix.os }}
          path: |
            criterion-summary.json
            perf-comparison.md
          if-no-files-found: ignore
          retention-days: 90

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The tier spawns real, multi-level process trees and polls for teardown, so
    # it runs longer than the unit tests; bound the whole job well above that.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Same arm64 additions and rationale as the `test` job above: real
      # execution on the aarch64-unknown-linux-gnu / aarch64-pc-windows-msvc
      # triplets instead of relying on a cross-compile check. The e2e
      # tier's real process trees make it heavier than `test`, but GitHub's
      # arm64 runners are free for public repos like the x86_64 ones, so the
      # added cost here is wall-clock time, not billing — acceptable given
      # this tier is exactly the containment-mechanism-sensitive one (Job
      # Object / cgroup v2 / process group) the platform matrix exists to
      # cover.
      matrix:
        os:
          [
            ubuntu-latest,
            windows-latest,
            macos-latest,
            ubuntu-24.04-arm,
            windows-11-arm,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The opt-in end-to-end containment tier (tests/e2e.rs, `e2e` feature):
      # leaked-grandchild reaping through the built binary, abrupt runner death,
      # a descendant holding the stdout pipe, rapid PID-reuse churn, `inspect` over
      # the live control plane, two concurrent runs contained independently,
      # control-plane `cancel`/`kill` reaping only the target run, a Ctrl-C cancel
      # (Unix), a `run` nested inside an outer Job Object (Windows), real-console
      # (Windows) and pseudo-terminal (Unix) `--inherit-stdio` smoke tests, and
      # the MSBuild node-reuse worker shape
      # (a synthetic worker cross-platform, plus a real
      # `dotnet build` when a `dotnet` SDK is present). Kept out of the default
      # `cargo test` job above (heavier, real process trees); `--nocapture` surfaces
      # each platform skip (e.g. the `dotnet`-absent skip).
      - run: cargo test --features e2e --test e2e -- --nocapture

  # release.yml's build-artifacts matrix ships six target triplets. With the
  # `test`/`e2e` jobs above now running natively on ubuntu-24.04-arm and
  # windows-11-arm (in addition to macos-latest, already Apple Silicon),
  # five of those six triplets run on their native libc and architecture.
  # The remaining x86_64-unknown-linux-musl test binaries are statically
  # linked, so they can execute on ubuntu-latest even though GitHub does not
  # host a musl userspace runner. This required job runs both the default and
  # e2e tiers against that shipped target, using the same apt toolchain as
  # release.yml's build-artifacts job. Stress remains in its dedicated
  # scheduled/manual workflow: it is a load campaign, not a release-target
  # compatibility gate. The two
  # aarch64 entries this job used to cross-compile-check
  # (aarch64-pc-windows-msvc, aarch64-unknown-linux-gnu) were dropped: they
  # would now duplicate the compilation half of the `test` job's native
  # aarch64 runs, and native execution is a strictly stronger check than a
  # cross-compiled `cargo check`.
  target-check:
    name: target-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      # musl's libc for the static build (the only remaining entry in this
      # matrix; see the job comment above for why the aarch64 entries and
      # their cross toolchains were dropped).
      - name: Install Linux cross toolchain
        if: ${{ matrix.apt != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Run unit and integration tests
        run: cargo test --target ${{ matrix.target }}
      - name: Run end-to-end containment tests
        run: cargo test --target ${{ matrix.target }} --features e2e --test e2e -- --nocapture

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Scan the dependency tree for security advisories, banned/duplicate
      # crates, disallowed licenses, and non-crates.io sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Spell-checks the tracked tree (source, docs, config — `typos` respects
      # `.gitignore`, so this pipeline's own gitignored `.work/` scratch tree
      # is never in scope). Picks up the root `typos.toml` automatically; see
      # CONTRIBUTING.md's "Documentation quality" section for the local
      # equivalent (`typos .`). Gating: every finding to date has been a
      # genuine misspelling fixed in the source, not a domain term needing an
      # exclusion (see `typos.toml`'s own comments).
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  docs-links:
    name: docs links (internal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gating: checks internal relative paths and section anchors across the
      # tracked documentation set only (README.md, CONTRIBUTING.md,
      # SECURITY.md, CHANGELOG.md, docs/**/*.md — not `.work/**`, this
      # pipeline's own gitignored scratch tree). `--offline` blocks every
      # network request, so http(s) links are skipped (reported as
      # "Excluded", never as a failure) rather than attempted here — see the
      # non-gating `docs-links-external` job below for those.
      # `include_fragments` (anchor checking) comes from `.lychee.toml`.
      - name: Check internal links and section anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --verbose --config .lychee.toml
            README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/**/*.md' 'skills/**/*.md'
          format: markdown
          fail: true

  docs-links-external:
    name: docs links (external)
    runs-on: ubuntu-latest
    # Non-gating: external http(s) URLs go over a real network connection in
    # CI, which can flake (rate limiting, a transient DNS/TLS hiccup, a
    # momentarily-down third-party site) for reasons unrelated to this repo —
    # same informational, continue-on-error pattern as the `coverage`/`perf`
    # jobs above (see K-029). Internal links/anchors are already gated by the
    # `docs-links` job above; this job additionally covers the network-only
    # half over the same scope.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache lychee's own request cache (`.lycheecache`) across runs to ease
      # up on external hosts and speed up repeat checks of unchanged URLs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-external-cache-${{ github.run_id }}
          restore-keys: lychee-external-cache-
      - name: Check all links, including external
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --verbose --cache --max-cache-age 1d --config .lychee.toml
            README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md 'docs/**/*.md' 'skills/**/*.md'
          format: markdown
          fail: false

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Verify the crate still builds on its declared Minimum Supported Rust
      # Version. Keep `toolchain` in sync with `rust-version` in Cargo.toml.
      # (`@master` + the `toolchain` input accepts a two-component "1.88"; the
      # version-branch refs require a full patch version like `@1.88.0`.)
      - uses: dtolnay/rust-toolchain@master # rolling toolchain selector — intentionally unpinned
        with:
          toolchain: "1.88"
      # rust-toolchain.toml tracks stable and would otherwise win here; remove it
      # so cargo uses the 1.88 toolchain installed above and truly tests the floor.
      - run: rm -f rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --all-targets
