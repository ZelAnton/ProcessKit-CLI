name: Release

# Manual release workflow. Needs the `CRATES_IO_TOKEN` repository secret to
# publish to crates.io.
#
# Shipped ENABLED: it is `workflow_dispatch`-only with no `push:`/tag trigger, so
# it never runs on its own — you click "Run workflow" in the Actions UI and pick
# a bump type. The version number is never typed by hand: pick patch/minor/major
# and the source-of-truth (`Cargo.toml`) drives everything, then gets committed
# back so the manifest, the git tag, and the GitHub Release never drift apart.
# The first release (no `v*` tag yet) ships the current `Cargo.toml` version
# as-is, ignoring the bump.
#
# Single-crate release: bump the version, auto-fill an empty `[Unreleased]` from
# git history via git-cliff, promote the curated changelog, verify the crate
# publishes (dry run), publish to crates.io, then tag `v<version>` and publish a
# GitHub Release. Publishing comes BEFORE the tag, so a failed publish strands
# nothing (just re-run). See CONTRIBUTING.md "Changelog". For a
# workspace of several independently-versioned crates, model
# this on vcs-toolkit-rs's release.yml instead (per-crate `crate`/`version`
# inputs and `<crate>-v<version>` tags).
#
# Prebuilt binaries: once the `release` job has published + tagged + created the
# GitHub Release, a downstream `build-artifacts` matrix fans out across the
# supported platforms (Windows/Linux x x86_64/aarch64, macOS aarch64 (Apple
# Silicon), plus static musl Linux builds for x86_64 and aarch64), builds each
# `--release` binary
# from the freshly-tagged commit, and attaches it to that SAME Release. Each
# archive ships with a `<archive>.sha256` checksum next to it and a signed
# build-provenance attestation (`actions/attest-build-provenance`) so a
# download can be verified end to end. It is a strictly-downstream
# enhancement, NOT a second release path: it never bumps, publishes to
# crates.io, tags, or creates a Release. Because it runs AFTER the sole
# irreversible step (crates.io), a build failure on one target strands
# nothing — `cargo install processkit-cli` and the Release still work, and
# the missing asset (archive + `.sha256` + attestation) can be built +
# `gh release upload`ed by hand (or the job re-run; upload is
# `--clobber`-idempotent, attestation is regenerated). The checksum and
# attestation are computed per target, inside each already-non-critical
# matrix leg, so they never become a blocking/critical path. This does not
# change the release ordering above.
#
# Package managers: after the archive matrix settles, `package-manifests`
# downloads the published checksum sidecars and generates winget, Scoop, and
# Homebrew distributor inputs from those exact digests. It attaches the files
# and a checksumed bundle to the existing Release, and mutates nothing outside
# this repository. A final `publish-package-repos` job then pushes the generated
# Homebrew formula — and, optionally, the Scoop manifest — into the tap/bucket
# repositories this project owns, but ONLY once an operator has created them and
# added the matching token secret (`HOMEBREW_TAP_TOKEN` / `SCOOP_BUCKET_TOKEN`).
# Until then it skips with a notice in the log, and even a configured channel
# that fails cannot fail the release (`continue-on-error: true`). winget keeps
# its required external review in `microsoft/winget-pkgs` and is deliberately
# not automated; see that job's comment and docs/installation.md. Both jobs are
# downstream of crates.io, the tag, the Release, and all archive uploads, so
# they cannot alter or strand the established release path.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored on the first release)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Never run two releases at once — they both bump + commit to the branch.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit + tag, and create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    # Expose the computed version/tag so the downstream `build-artifacts` job can
    # check out the exact tagged commit and name its archives after the version.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Mint a short-lived GitHub App installation token. Pushing the release commit
      # to `main` with it makes the **App** the actor — and the App sits in the
      # branch-protection ruleset's bypass list, so the push is allowed. The default
      # `github-actions[bot]` CANNOT be granted a ruleset bypass (it's a system actor,
      # not an App), and a PAT would expire; an App token is short-lived, auto-revoked,
      # and needs no rotation. Configure repo variable `RELEASE_APP_ID` + secret
      # `RELEASE_APP_PRIVATE_KEY`; until then this step is skipped and the push falls
      # back to the default `GITHUB_TOKEN` (fine while `main` is unprotected). See
      # docs/release-process.md's "GitHub App bypass" recipe.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, for version math and git-cliff
          # Persist the App token so the later `git push` to `main` runs as the App
          # (and thus uses its ruleset bypass). Empty when the App isn't configured →
          # fall back to the default token.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # We always release from `main`. workflow_dispatch still lets you pick any
      # ref in the "Use workflow from" dropdown, so reject anything else up front
      # rather than silently bumping + tagging some other branch.
      - name: Require main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must run from main (got '${{ github.ref }}'). Re-run with 'Use workflow from: main'."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned

      # Fail fast (in seconds) if the publish credential is missing — before the
      # slow build / version bump / changelog work — and with a clear message
      # instead of cargo's opaque auth error. (Publishing now precedes the tag,
      # so a missing token can no longer strand a tag; this is purely about
      # failing early and legibly.)
      - name: Preflight — require CRATES_IO_TOKEN
        env:
          TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN secret is not set. Add it under repo Settings → Secrets and variables → Actions before releasing."
            exit 1
          fi

      - name: Install tooling
        run: cargo install cargo-edit --locked

      - name: Install git-cliff
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: git-cliff@2

      # Compute the next version from Cargo.toml — never typed by hand. `bump`
      # is a fixed choice (not free-form), so interpolating it into the script
      # is not a script-injection risk; the derived outputs are passed to later
      # steps through `env:` rather than re-interpolated.
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 -oP '(?<=^version = ")[^"]+' Cargo.toml)
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse version from Cargo.toml (got '$CURRENT')"
            exit 1
          fi
          if git tag --list 'v*' | grep -q .; then
            # A prior release exists: apply the chosen bump.
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) NEW="$((MAJOR+1)).0.0" ;;
              minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
            PREV="v$CURRENT"
          else
            # First release: ship the current Cargo.toml version as-is.
            NEW="$CURRENT"
            PREV=""
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEW (previous: ${PREV:-none})"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      # No-op on the first release (already at the current version).
      - name: Bump version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo set-version "$VERSION"

      # Manual bullets always win. Only when [Unreleased] has no real bullets do
      # we fill it from commit subjects since the previous tag (or full history
      # on the first release), using cliff.toml's prefix→section rules.
      - name: Auto-fill empty [Unreleased] from git log
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          prev_tag = os.environ.get("PREV_TAG", "")
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          # Capture the [Unreleased] body up to the next version section, the
          # reference-link block (`[Unreleased]: ...` / `[x.y.z]: ...`), or EOF.
          # The link-block stop matters on a first release, where [Unreleased]
          # is the last `##` section and the capture would otherwise swallow
          # (and this step would then delete) the trailing link definitions.
          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)", text, re.M | re.S)
          if not m:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          body = m.group(1)
          has_real_bullets = any(re.match(r"^-\s+\S", ln) for ln in body.splitlines())
          if has_real_bullets:
              print("[Unreleased] already has manual entries; skipping auto-fill.")
              sys.exit(0)

          tag_exists = bool(prev_tag) and subprocess.run(
              ["git", "rev-parse", "--verify", prev_tag], capture_output=True
          ).returncode == 0

          if tag_exists:
              print(f"[Unreleased] is empty; generating from git log since {prev_tag}...")
              cliff_cmd = ["git-cliff", "--config", "cliff.toml", "--strip", "all", f"{prev_tag}..HEAD"]
          else:
              print("[Unreleased] is empty; generating from full git history...")
              cliff_cmd = ["git-cliff", "--config", "cliff.toml", "--strip", "all"]
          empty_hint = (
              "::error::No release-worthy commits found. Either add a manual entry to "
              "[Unreleased] in CHANGELOG.md, or commit changes with a recognised prefix "
              "(feat/fix/perf/ux/refactor/remove/...)."
          )

          result = subprocess.run(cliff_cmd, capture_output=True, text=True)
          if result.returncode != 0:
              # git-cliff itself failed (bad config, bad range, ...). Surface its
              # stderr rather than a Python traceback or the misleading
              # "no commits" hint below.
              print(f"::error::git-cliff failed: {result.stderr.strip()}", file=sys.stderr)
              sys.exit(1)
          generated = result.stdout.strip()
          if not generated:
              print(empty_hint, file=sys.stderr)
              sys.exit(1)

          new_text = text[: m.start(1)] + generated + "\n\n" + text[m.end(1) :]
          path.write_text(new_text)
          print("----- auto-generated [Unreleased] body -----")
          print(generated)
          print("--------------------------------------------")
          PY

      # Curate release notes from [Unreleased]: keep only "### Header" sections
      # that have at least one real bullet, dropping placeholder "-" lines.
      # Written OUTSIDE the working tree ($RUNNER_TEMP) so it neither dirties the
      # tree (which would abort `cargo publish`) nor lands in the packaged crate.
      - name: Extract release notes
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          text = pathlib.Path("CHANGELOG.md").read_text()
          # Bound the body by the next version section, the reference-link block,
          # or EOF (see the auto-fill step for why the link-block stop matters).
          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)", text, re.M | re.S)
          body = (m.group(1) if m else "").strip()

          parts = re.split(r"(?m)(^### .+$)", body)
          out = []
          for i in range(1, len(parts), 2):
              header = parts[i]
              section = parts[i + 1] if i + 1 < len(parts) else ""
              bullets = [ln for ln in section.splitlines() if re.match(r"^-\s+\S", ln)]
              if bullets:
                  if out:
                      out.append("")
                  out.append(header)
                  out.extend(bullets)

          result = "\n".join(out).strip()
          if not result:
              print(
                  "::error::[Unreleased] section in CHANGELOG.md is empty. "
                  "Add release notes before releasing.",
                  file=sys.stderr,
              )
              sys.exit(1)

          pathlib.Path(os.environ["NOTES_FILE"]).write_text(result + "\n")
          print("----- release notes -----")
          print(result)
          print("-------------------------")
          PY

      # Rename the curated `## [Unreleased]` heading to the new version + date,
      # leave a fresh empty Unreleased above it, and rewrite the reference links.
      # On the first release (no previous tag) the new-version link points at the
      # tag page; otherwise it's a compare link against the previous tag.
      - name: Promote [Unreleased] in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          prev_tag = os.environ.get("PREV_TAG", "")
          repo = os.environ["REPO"]
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          new_unreleased = (
              "## [Unreleased]\n\n"
              "### Added\n-\n\n"
              "### Changed\n-\n\n"
              "### Fixed\n-\n\n"
              f"## [{version}] - {date}"
          )
          text, n = re.subn(r"^## \[Unreleased\][ \t]*$", new_unreleased, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          if prev_tag:
              version_link = f"[{version}]: {repo}/compare/{prev_tag}...{tag}"
          else:
              version_link = f"[{version}]: {repo}/releases/tag/{tag}"
          link_replacement = f"[Unreleased]: {repo}/compare/{tag}...HEAD\n{version_link}"
          text, n = re.subn(r"^\[Unreleased\]:.*$", link_replacement, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '[Unreleased]: ...' reference link in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          path.write_text(text)
          print(f"Promoted [Unreleased] -> [{version}] - {date}")
          PY

      # Commit the bump + changelog locally (NOT pushed yet) so the next step can
      # verify against a clean tree, and the tag — once created — points at it.
      - name: Commit version bump + changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  "Zhelezniakou Anton"
          git config user.email "github@zelanton.net"
          # Stage exactly the release artifacts. (release-notes.md lives in
          # $RUNNER_TEMP, outside the tree, so it is never a candidate here.)
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release v${VERSION}"

      # Gate: build + package the crate exactly as `cargo publish` would, but
      # without uploading — catches build/packaging/metadata errors cleanly,
      # before the irreversible publish below consumes a real attempt. No token
      # needed for a dry run; release-notes.md is outside the tree so it is not
      # packaged.
      - name: Verify the crate publishes (dry run)
        # `--locked` asserts Cargo.lock matches the (just-bumped) manifest, so
        # the dry run can't silently re-resolve / rewrite the lockfile and dirty
        # the tree (which would then make the real publish below fail its
        # clean-tree check). cargo set-version already updated the lock.
        run: cargo publish --locked --dry-run

      # Publish FIRST — before the tag/push/Release. crates.io is the only
      # irreversible step (a version can never be re-published), so doing it
      # before anything is pushed means a failed publish leaves NO stranded tag:
      # you just re-run. Retry to ride out transient registry/network errors; an
      # "already uploaded" result (a prior run that published but failed before
      # tagging) counts as success, so the re-run proceeds to tag + Release.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -uo pipefail
          attempt=0
          max=3
          while :; do
            attempt=$((attempt + 1))
            if out="$(cargo publish --locked 2>&1)"; then
              printf '%s\n' "$out"
              break
            fi
            printf '%s\n' "$out"
            # Treat "this exact version is already published" as success (a prior
            # run that uploaded but failed before tagging). Match cargo's actual
            # phrasings specifically — a broad "already exists" would risk a false
            # positive that tags an unpublished version.
            if printf '%s' "$out" | grep -qiE 'crate version .* is already uploaded|already exists on [^[:space:]]*crates\.io index'; then
              echo "::notice::This version is already on crates.io — treating as published."
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::cargo publish failed after ${max} attempts."
              exit 1
            fi
            echo "::warning::cargo publish attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done

      # Only after the crate is live on crates.io: tag the release and push the
      # commit + tag atomically (if either ref is rejected, neither lands). A
      # non-atomic push that advanced the branch but dropped the tag would make
      # the next run bump from the already-bumped version and skip a release
      # number. actions/checkout leaves a detached HEAD, so the branch is named
      # explicitly (`git push origin HEAD` can't resolve a branch when detached).
      # We always release from main (enforced by the "Require main" step above).
      - name: Tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${VERSION}"

      # The tag now exists; attach the Release to it using the curated notes from
      # $RUNNER_TEMP. gh is pre-installed on ubuntu-latest. This runs AFTER the
      # crate is published and the tag pushed, so it must not be the step that
      # fails the release: it is idempotent (edit if a prior attempt created it)
      # and retried. If it still fails, the error tells you to finish by hand and
      # NOT to re-run — a re-run would read the already-bumped version from main
      # and ship the next version, stranding this one's Release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -uo pipefail
          attempt=0
          max=3
          while :; do
            attempt=$((attempt + 1))
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" && break
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" && break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::${TAG} is PUBLISHED to crates.io and the tag is pushed, but creating the GitHub Release failed. Finish it by hand: gh release create ${TAG} --notes-file <notes>. Do NOT re-run this workflow — it would bump to the next version and strand ${TAG}'s release."
              exit 1
            fi
            echo "::warning::GitHub Release attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done

  # Build the prebuilt binaries and attach them to the Release the `release` job
  # just created. Strictly downstream (`needs: release`) so the tag + Release
  # already exist; it only uploads assets (archive + `.sha256` checksum) and
  # records a provenance attestation — never bumps/publishes/tags/creates a
  # Release, so there is still exactly one release path. `fail-fast: false` means
  # one platform failing to build does not cancel the others or strand the
  # Release (the successful assets still upload; a missing one is a manual
  # `cargo build --release --target <triple>` + `gh release upload` away).
  build-artifacts:
    needs: release
    name: artifact (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # This job needs a broader permission set than the top-level default because
    # a job-level `permissions:` block REPLACES (does not merge with) the inherited
    # top-level `contents: write`, so it is re-declared here alongside the two
    # tokens `actions/attest-build-provenance` requires. The `release` job is left
    # untouched — it keeps only the top-level `contents: write` it already had.
    #   contents: write     — `gh release upload` attaches the archive + checksum
    #   id-token: write      — mint the OIDC token for Sigstore keyless signing
    #   attestations: write  — record the provenance attestation via the API
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: native x86_64, plus aarch64 cross-linked with the ARM64 MSVC
          # tools present on the hosted windows runner.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # Linux glibc: native x86_64, plus aarch64 cross-compiled with the
          # gcc-aarch64-linux-gnu cross linker.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
          # Static Linux: the musl target links libc statically, yielding a single
          # dependency-free binary for containers/minimal images. Shipped ALONGSIDE
          # the glibc build above, not instead of it.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          # Static Linux, Arm64: same musl approach as the x86_64 leg above, but
          # built NATIVELY on the ubuntu-24.04-arm hosted runner (the same
          # GitHub-hosted aarch64 runner the `test`/`e2e` jobs in ci.yml already
          # use) instead of cross-compiling from an x86_64 host. `musl-tools`
          # only wraps the HOST's own gcc with musl's headers/libs — there is no
          # apt-packaged aarch64-linux-musl cross-gcc — so producing an aarch64
          # musl binary needs an aarch64 host, exactly like the x86_64 leg needs
          # an x86_64 host. No `CARGO_TARGET_*_LINKER` override is needed either,
          # for the same already-native reason.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            apt: musl-tools
          # macOS: Apple Silicon on the default (arm64) runner image, native,
          # no cross toolchain needed.
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      # Build from the exact commit the release just tagged, so the binary embeds
      # the released version and matches what `cargo install` produces.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable # rolling toolchain selector — intentionally unpinned
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # Cross toolchains for the Linux targets that need one: the aarch64 glibc
      # linker, or musl's libc for the static build. Native targets skip this.
      - name: Install Linux cross toolchain
        if: ${{ matrix.apt != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      # `--locked` asserts the just-bumped Cargo.lock is authoritative (no silent
      # re-resolve). The aarch64 glibc linker override is keyed to that exact
      # triple, so cargo ignores it for every other target.
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Package the binary, plus `build.rs`'s generated shell completions and man
      # pages, plus a static `schema/` snapshot (the JSON Schema document and the
      # golden event fixture, copied straight from the tagged checkout — these are
      # tracked repo files, not build.rs output, so `fixtures/schema/v1/` stays the
      # one and only source of truth; no second generator, nothing to keep in
      # sync), into a per-target archive named with the version and the full
      # target triple (so the musl build is self-describing:
      # …-x86_64-unknown-linux-musl.tar.gz). .zip on Windows, .tar.gz elsewhere.
      # `build.rs` always runs on the host — even under `--target` cross-compiling
      # above — and writes to the fixed, triple-independent `target/assets/`, so
      # every matrix leg finds the same `completions`/`man` trees there.
      - name: Package archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="processkit-cli-v${VERSION}-${TARGET}"
          # Stage the binary plus completions/man/schema in the CWD first so the
          # archive holds the binary bare at its root (as every prior release
          # did), with `completions/`, `man/`, and `schema/` alongside it — not
          # under a nested target/<triple>/ or target/assets/ path.
          cp "target/${TARGET}/release/processkit-cli.exe" processkit-cli.exe
          cp -r target/assets/completions completions
          cp -r target/assets/man man
          mkdir -p schema
          cp fixtures/schema/v1/schema.json schema/schema.json
          cp fixtures/schema/v1/events.jsonl schema/events.jsonl
          7z a "${name}.zip" processkit-cli.exe completions man schema
          # Checksum the archive right after building it (the `shell: bash` on the
          # windows runner is Git Bash, which bundles coreutils `sha256sum`). The
          # file records the bare archive name, so `sha256sum -c <name>.zip.sha256`
          # verifies against a download kept under its published name.
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          echo "CHECKSUM=${name}.zip.sha256" >> "$GITHUB_ENV"

      - name: Package archive (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="processkit-cli-v${VERSION}-${TARGET}"
          # `-C DIR` applies to the file names that follow it, so this records
          # `processkit-cli` relative to the release dir, `completions`/`man`
          # relative to `target/assets`, and `schema` relative to the job
          # workspace — all four land at the archive root, bare `processkit-cli`
          # alongside the completions/man/schema trees, exactly as the Windows
          # step above stages them.
          mkdir -p schema
          cp fixtures/schema/v1/schema.json schema/schema.json
          cp fixtures/schema/v1/events.jsonl schema/events.jsonl
          tar -czf "${name}.tar.gz" \
            -C "target/${TARGET}/release" processkit-cli \
            -C "$(pwd)/target/assets" completions man \
            -C "$(pwd)" schema
          # Checksum the archive right after building it. Linux runners have
          # coreutils `sha256sum`; the macOS runner ships BSD tools without it, so
          # fall back to `shasum -a 256` (identical `<hash>  <file>` output). The
          # file records the bare archive name so `sha256sum -c <name>.tar.gz.sha256`
          # verifies against a download kept under its published name.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${name}.tar.gz.sha256" >> "$GITHUB_ENV"

      # Attach the archive and its `.sha256` checksum to the Release the `release`
      # job created. `--clobber` replaces rather than duplicates on a re-run,
      # keeping the upload idempotent for both files.
      - name: Upload artifact to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber

      # Record a signed SLSA build-provenance attestation for the archive, so a
      # downloader can `gh attestation verify <archive> --repo ZelAnton/ProcessKit-CLI`
      # to prove it was built by THIS workflow from the tagged commit — the
      # provenance half of the task, complementing the `.sha256` integrity check.
      # Kept LAST in the leg, downstream of the upload: the archive + checksum are
      # already on the Release before this runs, so an attestation hiccup blocks
      # nothing that matters (fail-fast: false, and the whole job is already past
      # the sole irreversible step). Re-running the job regenerates it. SHA-pinned
      # like every other third-party action in this file.
      - name: Attest build provenance for the archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ASSET }}

  # Build distributor inputs only after every archive leg has had a chance to
  # upload its checksum. `always()` semantics are intentional: an attestation
  # failure happens after the archive upload and must not suppress generation;
  # a genuinely missing required sidecar instead makes the generator fail with
  # a precise error. Like `build-artifacts`, this job only adds assets to an
  # already-published Release and never updates an external package repository;
  # pushing the files it generates into a tap/bucket is the separate,
  # operator-enabled `publish-package-repos` job below.
  package-manifests:
    needs: [release, build-artifacts]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    name: package-manager manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Download release checksum sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir checksums
          gh release download "$TAG" --pattern 'processkit-cli-v*.sha256' --dir checksums

      - name: Generate and validate package manifests
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/package-manifests-v${VERSION}"
          python scripts/generate_package_manifests.py \
            --version "$VERSION" \
            --checksums-dir checksums \
            --output-dir "$output"
          python -m json.tool "$output/scoop/processkit-cli.json" >/dev/null
          ruby -c "$output/homebrew/processkit-cli.rb"
          bundle="processkit-cli-v${VERSION}-package-manifests.tar.gz"
          tar -czf "$bundle" -C "$output" .
          sha256sum "$bundle" > "$bundle.sha256"
          echo "MANIFEST_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "MANIFEST_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Upload package manifests to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "$MANIFEST_BUNDLE" "$MANIFEST_BUNDLE.sha256" \
            "$MANIFEST_OUTPUT"/winget/*.yaml \
            "$MANIFEST_OUTPUT"/scoop/processkit-cli.json \
            "$MANIFEST_OUTPUT"/homebrew/processkit-cli.rb \
            --clobber

  # Publish the generated distributor files into the package repositories this
  # project itself owns — what turns an attached release asset into an actually
  # installable `brew install <owner>/tap/processkit-cli`. This is the only job
  # in this workflow that writes outside this repository, so it is deliberately
  # last and deliberately incapable of gating a release.
  #
  # Operator setup — nothing below runs until this exists:
  #   1. Homebrew: create the repository
  #      `<owner>/homebrew-tap` (the name `brew tap <owner>/tap` expands to) and
  #      add the repository secret `HOMEBREW_TAP_TOKEN` — a token that can push
  #      to THAT repository and nothing else (a fine-grained PAT with Contents:
  #      read and write scoped to the tap, or a GitHub App installation token).
  #      The built-in `GITHUB_TOKEN` cannot be used: it is scoped to this
  #      repository only.
  #   2. Scoop (optional, fully independent): create `<owner>/scoop-bucket` and
  #      add `SCOOP_BUCKET_TOKEN` the same way. Either, both, or neither channel
  #      may be configured.
  #   3. Repository variables `HOMEBREW_TAP_REPOSITORY` / `SCOOP_BUCKET_REPOSITORY`
  #      override those default `<owner>/...` targets when the repository is
  #      named differently. They are the only knob; the token secret alone
  #      decides whether a channel publishes at all.
  # docs/installation.md ("Package-manager manifests") documents the same setup
  # for readers, and its availability table — not this comment — is what users
  # are told to trust about a channel actually serving the package.
  #
  # winget is intentionally NOT automated here: there is no project-owned winget
  # repository to push to. Publication is a pull request into
  # `microsoft/winget-pkgs` gated by Microsoft's own automated and human review,
  # so an automated submission would need a maintained fork plus a broadly
  # scoped token, and a green step still would not mean the version is
  # installable. The three-file manifest stays an attached release asset for a
  # manual (or `wingetcreate submit`) submission the operator chooses to make.
  #
  # Why this can never break a release, in three independent layers:
  #   1. Placement — it `needs:` both `release` and `package-manifests`, so
  #      crates.io, the tag, the GitHub Release, every archive, and every
  #      manifest are already published before it starts.
  #   2. Unconfigured is a skip, not a failure — a missing token secret prints a
  #      notice naming the repository and secret to create, and the publish
  #      steps do not run. `secrets` is unavailable to `if:` expressions, so the
  #      check is made in the shell below and republished as a plain output.
  #   3. `continue-on-error: true` — even a fully configured channel that fails
  #      (repository deleted, token expired or revoked, protected branch) leaves
  #      the release itself green. The failure is reported as an annotation and
  #      the fix is to re-run this one job; publication is idempotent. Re-run
  #      the FAILED release's own run, though: this job always publishes the
  #      version of the release it belongs to, so re-running an older release's
  #      run would move the tap/bucket back to that older version.
  publish-package-repos:
    needs: [release, package-manifests]
    name: publish tap and bucket
    runs-on: ubuntu-latest
    continue-on-error: true
    # Narrower than the top-level `contents: write`, which a job-level
    # `permissions:` block REPLACES rather than merges with (the same rule
    # `build-artifacts` documents above). This job only READS this repository's
    # release assets; every write goes to an external repository and is
    # authenticated by that channel's own token, never by `GITHUB_TOKEN`.
    permissions:
      contents: read
    steps:
      # Presence of a channel's token secret is the enable switch. `secrets` is
      # not available to `if:` at job or step level, so the decision is made
      # here and republished as ordinary outputs the steps below can branch on.
      # The token values are only tested for emptiness — never printed, written
      # to a file, or passed anywhere else from this step.
      - name: Resolve publication targets
        id: targets
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          HOMEBREW_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          SCOOP_REPOSITORY: ${{ vars.SCOOP_BUCKET_REPOSITORY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # An operator-set variable ends up inside a clone URL and in this
          # step's own outputs, so require the exact `owner/name` shape and skip
          # the channel loudly rather than hand git something surprising. A
          # rejected value is never republished as an output either.
          #
          # Bash's own `=~` (as the version parser above already uses), NOT
          # `grep -E`: grep matches line by line, so it would accept a
          # multi-line variable whose FIRST line is a valid slug — and that
          # value, written to $GITHUB_OUTPUT, could forge additional outputs.
          # `=~` anchors `^`/`$` to the whole string, so such a value is
          # rejected outright.
          slug_ok() {
            [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          }

          homebrew=false
          homebrew_repository="${HOMEBREW_REPOSITORY:-${OWNER}/homebrew-tap}"
          if [ -z "${HOMEBREW_TOKEN}" ]; then
            echo "::notice::Homebrew tap publication is off: repository secret HOMEBREW_TAP_TOKEN is not set. Create ${homebrew_repository} and add a token that can push to it, and every release will publish Formula/processkit-cli.rb there."
          elif ! slug_ok "${homebrew_repository}"; then
            echo "::warning::Skipping the Homebrew tap: HOMEBREW_TAP_REPOSITORY ('${homebrew_repository}') is not an owner/name repository slug."
          else
            homebrew=true
            echo "Homebrew tap target: ${homebrew_repository}"
          fi
          [ "${homebrew}" = true ] || homebrew_repository=""

          scoop=false
          scoop_repository="${SCOOP_REPOSITORY:-${OWNER}/scoop-bucket}"
          if [ -z "${SCOOP_TOKEN}" ]; then
            echo "::notice::Scoop bucket publication is off: repository secret SCOOP_BUCKET_TOKEN is not set. Create ${scoop_repository} and add a token that can push to it, and every release will publish bucket/processkit-cli.json there."
          elif ! slug_ok "${scoop_repository}"; then
            echo "::warning::Skipping the Scoop bucket: SCOOP_BUCKET_REPOSITORY ('${scoop_repository}') is not an owner/name repository slug."
          else
            scoop=true
            echo "Scoop bucket target: ${scoop_repository}"
          fi
          [ "${scoop}" = true ] || scoop_repository=""

          any=false
          if [ "${homebrew}" = true ] || [ "${scoop}" = true ]; then
            any=true
          fi

          {
            echo "homebrew=${homebrew}"
            echo "homebrew_repository=${homebrew_repository}"
            echo "scoop=${scoop}"
            echo "scoop_repository=${scoop_repository}"
            echo "any=${any}"
          } >> "$GITHUB_OUTPUT"

      # A tap/bucket must serve exactly the bytes the Release advertises, so the
      # files are fetched back from the Release instead of being regenerated
      # here: same generator run, same digests, and this job stays re-runnable
      # on its own. `package-manifests` is a `needs:` of this job and always
      # uploads both files, so both patterns are guaranteed to match.
      - name: Download the published manifests
        if: ${{ steps.targets.outputs.any == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p manifests
          gh release download "$TAG" --dir manifests \
            --pattern 'processkit-cli.rb' \
            --pattern 'processkit-cli.json'

      # One publisher, invoked once per channel. The two publications must
      # behave identically — same idempotence check, same commit shape, same
      # failure text — and a second inline copy is exactly how those two
      # silently drift apart, so the script is written once here.
      - name: Stage the publisher
        if: ${{ steps.targets.outputs.any == 'true' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/publish-package-repo.sh" <<'SH'
          set -euo pipefail

          work="${RUNNER_TEMP}/publish-${CHANNEL_ID}"
          rm -rf "${work}"

          # The token is a registered secret (masked in logs) and this checkout
          # is thrown away with the ephemeral runner.
          git clone --quiet "https://x-access-token:${TOKEN}@github.com/${TARGET_REPOSITORY}.git" "${work}"
          git -C "${work}" config user.name "Zhelezniakou Anton"
          git -C "${work}" config user.email "github@zelanton.net"

          mkdir -p "${work}/$(dirname "${TARGET_PATH}")"
          cp "${SOURCE_FILE}" "${work}/${TARGET_PATH}"
          git -C "${work}" add -- "${TARGET_PATH}"

          # Re-running this job after a successful publication must be a no-op,
          # not an empty commit: generation is deterministic from the tagged
          # script plus the release checksums, so identical bytes mean the
          # channel already serves this version.
          if git -C "${work}" diff --cached --quiet; then
            echo "::notice::${CHANNEL_NAME} already serves processkit-cli ${VERSION}; nothing to push."
            exit 0
          fi

          git -C "${work}" commit --quiet -m "processkit-cli ${VERSION}"
          # Push to the target's own default branch (`main`, `master`, ...),
          # resolved from the clone rather than assumed.
          branch="$(git -C "${work}" symbolic-ref --short HEAD)"
          git -C "${work}" push --quiet origin "HEAD:refs/heads/${branch}"
          echo "::notice::Published processkit-cli ${VERSION} to ${TARGET_REPOSITORY} (${TARGET_PATH})."
          SH

      - name: Publish the Homebrew formula
        id: homebrew
        if: ${{ steps.targets.outputs.homebrew == 'true' }}
        # Per-step, so a broken tap cannot also skip the independent Scoop half
        # below; the job-level flag then keeps the release itself green.
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TARGET_REPOSITORY: ${{ steps.targets.outputs.homebrew_repository }}
          TARGET_PATH: Formula/processkit-cli.rb
          SOURCE_FILE: manifests/processkit-cli.rb
          CHANNEL_ID: homebrew
          CHANNEL_NAME: The Homebrew tap
          VERSION: ${{ needs.release.outputs.version }}
        run: bash "$RUNNER_TEMP/publish-package-repo.sh"

      - name: Publish the Scoop manifest
        id: scoop
        if: ${{ steps.targets.outputs.scoop == 'true' }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          TARGET_REPOSITORY: ${{ steps.targets.outputs.scoop_repository }}
          TARGET_PATH: bucket/processkit-cli.json
          SOURCE_FILE: manifests/processkit-cli.json
          CHANNEL_ID: scoop
          CHANNEL_NAME: The Scoop bucket
          VERSION: ${{ needs.release.outputs.version }}
        run: bash "$RUNNER_TEMP/publish-package-repo.sh"

      # A `continue-on-error` failure is easy to miss on an otherwise green
      # release, so state each channel's outcome explicitly — as an annotation
      # and in the run summary — including "not configured".
      - name: Report publication outcome
        if: ${{ always() }}
        env:
          HOMEBREW_ENABLED: ${{ steps.targets.outputs.homebrew }}
          HOMEBREW_OUTCOME: ${{ steps.homebrew.outcome }}
          HOMEBREW_REPOSITORY: ${{ steps.targets.outputs.homebrew_repository }}
          SCOOP_ENABLED: ${{ steps.targets.outputs.scoop }}
          SCOOP_OUTCOME: ${{ steps.scoop.outcome }}
          SCOOP_REPOSITORY: ${{ steps.targets.outputs.scoop_repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          report() {
            label="$1"
            enabled="$2"
            outcome="$3"
            repository="$4"
            secret="$5"
            if [ -z "${enabled}" ]; then
              # Only reachable if target resolution itself never completed —
              # report that, rather than misreading it as "not configured".
              line="${label}: unknown — this job did not get as far as resolving its target."
              echo "::error::${line}"
            elif [ "${enabled}" != true ]; then
              line="${label}: not configured — set ${secret} to publish there."
            elif [ "${outcome}" = success ]; then
              line="${label}: up to date at ${repository} for v${VERSION}."
            elif [ "${outcome}" = skipped ]; then
              line="${label}: not attempted — an earlier step in this job failed."
              echo "::error::${line}"
            else
              line="${label}: FAILED for ${repository}. Release v${VERSION} is unaffected; repair the repository or its token and re-run this job."
              echo "::error::${line}"
            fi
            echo "- ${line}" >> "$GITHUB_STEP_SUMMARY"
            echo "${line}"
          }
          echo "### Package repository publication" >> "$GITHUB_STEP_SUMMARY"
          report "Homebrew tap" "${HOMEBREW_ENABLED}" "${HOMEBREW_OUTCOME}" "${HOMEBREW_REPOSITORY}" HOMEBREW_TAP_TOKEN
          report "Scoop bucket" "${SCOOP_ENABLED}" "${SCOOP_OUTCOME}" "${SCOOP_REPOSITORY}" SCOOP_BUCKET_TOKEN
